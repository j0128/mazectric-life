    <!-- 暖光 -->
    <circle cx="256" cy="262" r="190" fill="url(#glow)"/>
    <!-- 細胞聚落：方塊＋散落細胞 -->
    <g>
      <rect x="196" y="218" width="58" height="58" rx="6" fill="#00000055" transform="translate(10 14)"/>
      <rect x="258" y="218" width="58" height="58" rx="6" fill="#00000055" transform="translate(10 14)"/>
      <rect x="196" y="280" width="58" height="58" rx="6" fill="#00000055" transform="translate(10 14)"/>
      <rect x="258" y="280" width="58" height="58" rx="6" fill="#00000055" transform="translate(10 14)"/>
      <rect x="196" y="218" width="58" height="58" rx="6" fill="url(#gold)"/>
      <rect x="258" y="218" width="58" height="58" rx="6" fill="url(#gold)"/>
      <rect x="196" y="280" width="58" height="58" rx="6" fill="url(#gold)"/>
      <rect x="258" y="280" width="58" height="58" rx="6" fill="url(#gold)"/>
