    <clipPath id="rr"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#rr)">
